<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Shield Glow / Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Keyhole Gradient -->
    <linearGradient id="key-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Phone Glass Gradient -->
    <linearGradient id="phone-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Shield Inner Shadow / Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Canvas Background Card -->
  <rect width="800" height="800" rx="160" fill="url(#bg-grad)" />

  <!-- Outer Protective Shield Base -->
  <g filter="url(#drop-shadow)">
    <!-- Main Shield -->
    <path d="M400 140 
             C500 140, 570 170, 620 200 
             C620 370, 610 520, 400 660 
             C190 520, 180 370, 180 200 
             C230 170, 300 140, 400 140 Z" 
          fill="url(#shield-grad)" 
          stroke="#93c5fd" 
          stroke-opacity="0.3" 
          stroke-width="4" />

    <!-- Shield Inner Highlight Border -->
    <path d="M400 165 
             C490 165, 550 192, 595 220 
             C595 360, 585 490, 400 620 
             C215 490, 205 360, 205 220 
             C250 192, 310 165, 400 165 Z" 
          fill="none" 
          stroke="url(#accent-grad)" 
          stroke-width="6" 
          stroke-linecap="round" 
          opacity="0.8" />
  </g>

  <!-- Smartphone / Authentication Device (Centered) -->
  <g filter="url(#drop-shadow)">
    <!-- Phone Body -->
    <rect x="290" y="240" width="220" height="360" rx="32" fill="#0f172a" stroke="#475569" stroke-width="6" />
    
    <!-- Phone Screen Fill -->
    <rect x="302" y="260" width="196" height="320" rx="22" fill="#1e293b" />
    <rect x="302" y="260" width="196" height="320" rx="22" fill="url(#phone-grad)" />

    <!-- Speaker Notch -->
    <rect x="370" y="272" width="60" height="6" rx="3" fill="#475569" />
  </g>

  <!-- 2FA Mobile App UI Elements -->
  <g>
    <!-- Lock Icon Graphic on Phone Screen -->
    <path d="M400 315 C383 315, 370 328, 370 345 V360 H430 V345 C430 328, 417 315, 400 315 Z 
             M362 360 H438 C443 360, 447 364, 447 369 V401 C447 406, 443 410, 438 410 H362 C357 410, 353 406, 353 401 V369 C353 364, 357 360, 362 360 Z" 
          fill="#38bdf8" />

    <!-- Keyhole cutout -->
    <circle cx="400" cy="380" r="5" fill="#0f172a" />
    <path d="M398 380 L402 380 L404 395 L396 395 Z" fill="#0f172a" />

    <!-- Passcode Dots UI -->
    <circle cx="345" cy="440" r="8" fill="#38bdf8" />
    <circle cx="372" cy="440" r="8" fill="#38bdf8" />
    <circle cx="399" cy="440" r="8" fill="#38bdf8" />
    <circle cx="426" cy="440" r="8" fill="#38bdf8" />
    <circle cx="453" cy="440" r="8" fill="#475569" />
    <circle cx="480" cy="440" r="8" fill="#475569" />

    <!-- Timer Circle & Checkmark Indicator -->
    <g transform="translate(400, 510)">
      <!-- Animated/Progress Timer Circle -->
      <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#334155" stroke-width="5" />
      <path d="M 0 -28 A 28 28 0 1 1 -24.2 14" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
      
      <!-- Center Success Checkmark -->
      <path d="M-10 1 L-3 8 L 11 -6" fill="none" stroke="#22c55e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Foreground Golden Key (Symbolizing Secondary Key / Access Factor) -->
  <g filter="url(#drop-shadow)" transform="rotate(-25 320 540)">
    <!-- Key Shaft and Teeth -->
    <path d="M310 530 L450 530 L450 550 L430 550 L430 570 L410 570 L410 550 L390 550 L390 570 L370 570 L370 550 L310 550 Z" 
          fill="url(#key-grad)" />
    
    <!-- Key Bow / Handle -->
    <circle cx="280" cy="540" r="45" fill="url(#key-grad)" stroke="#7dd3fc" stroke-width="4" />
    <circle cx="280" cy="540" r="20" fill="#0f172a" />
  </g>

  <!-- Foreground Shield Overlay Grid / Tech Accents -->
  <g opacity="0.3">
    <circle cx="400" cy="140" r="4" fill="#ffffff" />
    <circle cx="620" cy="200" r="4" fill="#ffffff" />
    <circle cx="180" cy="200" r="4" fill="#ffffff" />
    <circle cx="400" cy="660" r="4" fill="#ffffff" />
  </g>
</svg>
