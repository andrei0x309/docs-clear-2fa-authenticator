name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches:
      - main
      - 'dev/**'
  schedule:
    - cron: '5 2 * * *'
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Add bun
        uses: oven-sh/setup-bun@v2

      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: bun install
      
      - name: Update Changelog
        run: bun run update-changelog
      
      - name: Build the site
        run: bun run build
      
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Write Schedule Log
        run: echo "Deployed at $(date)\n" >> schedule.log
        if: github.event_name == 'schedule'

      - name: Commit Schedule Log
        id: commit
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: Update schedule deploy log `date`"
          add: "schedule.log"
          committer_name: "GitHub Actions"
          committer_email: 41898282+github-actions[bot]@users.noreply.github.com
        if: github.event_name == 'schedule'
         
        # with:
          # path: . # The root location of your Astro project inside the repository. (optional)
          # node-version: 24 # The specific version of Node that should be used to build your site. Defaults to 24. (optional)
          # package-manager: pnpm@latest # The Node package manager that should be used to install dependencies and build your site. Automatically detected based on your lockfile. (optional)
          # build-cmd: pnpm run build # The command to run to build your site. Runs the package build script/task by default. (optional)
        # env:
          # PUBLIC_POKEAPI: 'https://pokeapi.co/api/v2' # Use single quotation marks for the variable value. (optional)

  # Deployment job
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        if: github.ref == 'refs/heads/main'